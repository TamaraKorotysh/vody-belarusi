<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Воды Беларуси</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --accent:#ff7a3d; --water:#1f8fe0; --ink:#13232b; --ink2:#4b6169;
  --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.95); --line:rgba(19,35,43,.12); --shadow:rgba(20,40,50,.35);
  --f-display:"Unbounded","Segoe UI",system-ui,sans-serif; --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--ink:#e8f1f3;--ink2:#9ab0b7;--glass:rgba(18,30,36,.72);--glass-line:rgba(255,255,255,.12);--line:rgba(232,241,243,.14);--shadow:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e1a20;font-family:var(--f-body);color:var(--ink);font-size:15px;line-height:1.5;overflow:hidden}
#map{position:absolute;inset:0}
.glass{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 20px 50px -24px var(--shadow)}
.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;pointer-events:none;z-index:2}
.top>*{pointer-events:auto}
.brand{border-radius:18px;padding:10px 16px}
.brand h1{font-family:var(--f-display);font-size:20px;margin:0;line-height:1.2}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink2)}
.seg{display:flex;border-radius:999px;padding:3px}
button{font:inherit;color:inherit;cursor:pointer}
.seg button{border:0;background:none;padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--glass-solid,#fff)}
@media (prefers-color-scheme:dark){.seg button[aria-pressed="true"]{color:#0e1a20}}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;border-radius:18px;padding:8px;z-index:2;max-height:calc(100% - 120px);overflow:auto}
.list h4{margin:4px 8px 2px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.chip{border:0;background:none;text-align:left;padding:5px 10px;border-radius:10px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.chip:hover{background:var(--line)}
.chip i{width:14px;height:3px;border-radius:2px;background:var(--water)}
.chip.lake i{width:9px;height:9px;border-radius:50%;margin:0 2.5px}
.chip[aria-pressed="true"]{color:var(--accent)}
.chip[aria-pressed="true"] i{background:var(--accent)}
.card{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:360px;border-radius:22px;padding:22px;overflow:auto;z-index:3;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.card.hide{transform:translateX(30px);opacity:0;pointer-events:none}
.close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:var(--line);font-size:18px;line-height:1}
.kind{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.card h2{font-family:var(--f-display);font-size:28px;margin:4px 0 0;line-height:1.15}
.be{color:var(--ink2);font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin:16px 0}
.stats div{background:var(--glass);padding:10px 12px}
.stats dt{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.stats dd{margin:2px 0 0;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.route{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.route .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--water);margin-top:6px}
.route .dot.end{background:var(--water)}
.route .ln{width:2px;height:14px;background:var(--water);opacity:.4;margin-left:4px}
.route b{display:block;font-weight:600}.route small{color:var(--ink2);font-size:12px}
.card h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:18px 0 6px}
.card p{margin:0}.card ul{margin:0;padding-left:18px;display:grid;gap:6px}
.note{margin-top:18px;font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}
.zoomhint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;z-index:2;transition:opacity .4s;white-space:nowrap}
.maplibregl-ctrl-bottom-right{z-index:1}
@media (max-width:760px){
  .card{top:auto;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));width:auto;height:58%;bottom:max(10px,env(safe-area-inset-bottom))}
  .card.hide{transform:translateY(40px)}
  .list{flex-direction:row;flex-wrap:nowrap;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));max-height:none;overflow-x:auto}
  .list h4{display:none}.chip{white-space:nowrap}
  .brand p{display:none}.zoomhint{bottom:80px}
}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="brand glass"><h1>Воды Беларуси</h1><p>Приблизьте реку, чтобы увидеть течение</p></div>
  <div class="seg glass" role="group" aria-label="Подложка">
    <button id="b-sat" aria-pressed="true" data-base="sat">Спутник</button>
    <button id="b-map" aria-pressed="false" data-base="map">Карта</button>
  </div>
  <div class="seg glass" role="group" aria-label="Вид">
    <button id="b-3d" aria-pressed="true" data-v="3d">3D</button>
    <button id="b-2d" aria-pressed="false" data-v="2d">2D</button>
  </div>
</div>
<nav class="list glass" id="list" aria-label="Реки и озёра"></nav>
<div class="zoomhint glass" id="zoomhint">Приблизьте реку, чтобы увидеть, как течёт вода</div>

    stats:[["Площадь","36,1 км²"],["Наибольшая глубина","12 м"],["Объём воды","≈ 220 млн м³"],["Район","Браславский"]],
    from:["Река Друйка вытекает из озера","Беларусь"], to:["Друйка — Западная Двина — Балтика",""],
    name:"Название балтского происхождения, как у многих озёр Поозерья.",
    facts:["Крупнейшее озеро в группе Браславских озёр.","Браславские озёра — национальный парк, где в одном районе собрано больше 30 озёр."] }
};

const CITIES=[["Минск",27.56,53.9,1],["Брест",23.69,52.1,1],["Гродно",23.83,53.68,1],["Гомель",30.98,52.43,1],["Могилёв",30.33,53.9,1],["Витебск",30.2,55.19,1],["Полоцк",28.8,55.49,2],["Пинск",26.1,52.11,2],["Бобруйск",29.22,53.14,2],["Борисов",28.5,54.23,2],["Мозырь",29.25,52.05,2],["Орша",30.42,54.51,2],["Речица",30.39,52.36,2],["Мядель",26.94,54.88,3],["Браслав",27.03,55.64,3],["Лида",25.3,53.89,2],["Молодечно",26.85,54.31,2],["Слуцк",27.56,53.02,2],["Барановичи",26.01,53.13,2],["Новополоцк",28.65,55.53,3],["Жлобин",30.03,52.89,3],["Туров",27.73,52.07,3]];
const GLYPHS="https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf";
const STYLE_MAP="https://tiles.openfreemap.org/styles/liberty";
const STYLE_SAT={version:8,glyphs:GLYPHS,sources:{sat:{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,maxzoom:19,attribution:"Спутник © Esri, Maxar, Earthstar Geographics"}},layers:[{id:"sat",type:"raster",source:"sat"}]};
const DEM={type:"raster-dem",tiles:["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],encoding:"terrarium",tileSize:256,maxzoom:14,attribution:"Рельеф: Mapzen Terrain Tiles"};

const map=new maplibregl.Map({container:"map",style:STYLE_SAT,center:[27.9,53.55],zoom:5.9,pitch:52,bearing:-12,maxPitch:75,attributionControl:{compact:true},hash:false});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"bottom-right");
let is3d=true, selected=null;

// ---------- flow particles ----------
const R=6371000, rad=Math.PI/180;
const lines=[];
for(const f of GEO.water.features){ if(f.properties.kind!=="river")continue;
  for(const c of f.geometry.coordinates){ const d=[0];
    for(let i=1;i<c.length;i++){const k=Math.cos(c[i][1]*rad);const dx=(c[i][0]-c[i-1][0])*rad*R*k,dy=(c[i][1]-c[i-1][1])*rad*R;d.push(d[i-1]+Math.hypot(dx,dy))}
    lines.push({c,d,L:d[d.length-1],name:f.properties.name});
  }}
const parts=[]; const SPACING=160; // metres between particles at full density
for(let li=0;li<lines.length;li++){const n=Math.max(1,Math.floor(lines[li].L/SPACING));
  for(let i=0;i<n;i++)parts.push({li,o:Math.random()*lines[li].L,lat:(Math.random()*2-1)*.85,sp:.75+Math.random()*.5,lv:Math.random(),tr:.6+Math.random()*.8})}
function at(line,s){ // position + unit direction at distance s
  const {c,d}=line; let lo=0,hi=d.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(d[m]<=s)lo=m; else hi=m}
  const t=(s-d[lo])/((d[hi]-d[lo])||1), a=c[lo], b=c[hi];
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, b[0]-a[0], b[1]-a[1]];
}
let phase=0,last=performance.now(),lastPush=0;
const empty={type:"FeatureCollection",features:[]};
function tick(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  const z=map.getZoom();
  const mpp=156543.03*Math.cos(53.7*rad)/Math.pow(2,z); // metres per pixel
  phase+=dt*70*mpp; // ~70 px/s on screen whatever the zoom
  if(now-lastPush>33 && map.getSource("flow")){ lastPush=now;
    if(z<8){ map.getSource("flow").setData(empty) }
    else{
      const b=map.getBounds(), pad=.2*(b.getEast()-b.getWest());
      const W=b.getWest()-pad,E=b.getEast()+pad,S=b.getSouth()-pad,N=b.getNorth()+pad;
      const half=.42*Math.min(18,4.5*Math.pow(1.33,z-9))*mpp; // half river width in metres
      const trail=34*mpp, dens=Math.min(1,.12*Math.pow(2,z-8));
      const feats=[];
      for(const p of parts){ if(p.lv>dens)continue; const ln=lines[p.li];
        let s=(p.o+phase*p.sp)%ln.L;
        const h=at(ln,s); if(h[0]<W||h[0]>E||h[1]<S||h[1]>N)continue;
        const s2=Math.max(0,s-trail*p.tr), q1=at(ln,s2), q2=at(ln,(s+2*s2)/3), q3=at(ln,(2*s+s2)/3);
        const k=Math.cos(h[1]*rad), len=Math.hypot(h[2]*k,h[3])||1;
        const nx=-h[3]/len, ny=h[2]*k/len; // normal (in metres space)
        const off=p.lat*half, ox=nx*off/(R*k*rad), oy=ny*off/(R*rad);
        feats.push({type:"Feature",properties:{},geometry:{type:"LineString",coordinates:[[q1[0]+ox,q1[1]+oy],[q2[0]+ox,q2[1]+oy],[q3[0]+ox,q3[1]+oy],[h[0]+ox,h[1]+oy]]}});
        if(feats.length>4000)break;
      }
      map.getSource("flow").setData({type:"FeatureCollection",features:feats});
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- layers ----------
function addLayers(){
  if(map.getSource("water"))return;
  const sat=current==="sat";
  if(!map.getSource("dem"))map.addSource("dem",DEM);
  if(!map.getSource("dem-shade"))map.addSource("dem-shade",DEM);
  const firstSymbol=(map.getStyle().layers.find(l=>l.type==="symbol")||{}).id;
  if(!sat)map.addLayer({id:"hillshade",type:"hillshade",source:"dem-shade",paint:{"hillshade-exaggeration":.45,"hillshade-shadow-color":"#2c4033","hillshade-highlight-color":"#ffffff","hillshade-accent-color":"#5b6b55"}},firstSymbol);
  const world=[[-180,-85],[180,-85],[180,85],[-180,85],[-180,-85]];
  map.addSource("mask",{type:"geojson",data:{type:"Feature",geometry:{type:"Polygon",coordinates:[world,GEO.border.slice().reverse()]}}});
  map.addSource("border",{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:GEO.border}}});
  map.addSource("water",{type:"geojson",data:GEO.water});
  map.addSource("flow",{type:"geojson",data:empty,lineMetrics:true});
  map.addLayer({id:"mask",type:"fill",source:"mask",paint:{"fill-color":sat?"#0b1418":"#e9eef0","fill-opacity":sat?.55:.6}});
  map.addLayer({id:"border-glow",type:"line",source:"border",paint:{"line-color":"#ffffff","line-width":8,"line-blur":6,"line-opacity":.8}});
  map.addLayer({id:"border",type:"line",source:"border",paint:{"line-color":sat?"#ffd9a8":"#c04f2c","line-width":1.6,"line-dasharray":[3,2]}});
  const sel=["==",["get","name"],selected||""];
  map.addLayer({id:"lakes",type:"fill",source:"water",filter:["==",["get","kind"],"lake"],paint:{"fill-color":["case",sel,"#ff9a5c","#3aa3ec"],"fill-opacity":["interpolate",["linear"],["zoom"],6,.9,10,.35]}});
  map.addLayer({id:"lakes-line",type:"line",source:"water",filter:["==",["get","kind"],"lake"],paint:{"line-color":["case",sel,"#ff7a3d","#ffffff"],"line-width":["case",sel,3,1.5],"line-opacity":.9}});
  map.addLayer({id:"river-glow",type:"line",source:"water",filter:["==",["get","kind"],"river"],layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":["case",sel,"#ffb37a","#7fd0ff"],"line-blur":["interpolate",["linear"],["zoom"],5,3,12,10],"line-opacity":.55,
      "line-width":["interpolate",["exponential",1.6],["zoom"],5,5,9,14,13,30,16,50]}});
  map.addLayer({id:"river",type:"line",source:"water",filter:["==",["get","kind"],"river"],layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":["case",sel,"#ff7a3d","#1f8fe0"],
      "line-width":["interpolate",["exponential",1.6],["zoom"],5,1.8,9,4.5,13,12,16,18],"line-opacity":["interpolate",["linear"],["zoom"],10.5,1,13,.4]}});
  map.addLayer({id:"flow",type:"line",source:"flow",layout:{"line-cap":"round"},
    paint:{"line-width":["interpolate",["linear"],["zoom"],8,1.4,12,2.4,16,3.5],
      "line-opacity":["interpolate",["linear"],["zoom"],8,0,9.2,.95],
      "line-gradient":["interpolate",["linear"],["line-progress"],0,"rgba(255,255,255,0)",1,"rgba(235,250,255,1)"]}});
  map.addLayer({id:"river-hit",type:"line",source:"water",filter:["==",["get","kind"],"river"],paint:{"line-color":"#000","line-opacity":0,"line-width":18}});
  map.addLayer({id:"water-label",type:"symbol",source:"water",filter:["==",["get","kind"],"river"],
    layout:{"symbol-placement":"line","text-field":["get","name"],"text-font":["Noto Sans Italic"],"text-size":["interpolate",["linear"],["zoom"],5,12,10,16],"symbol-spacing":260,"text-letter-spacing":.08},
    paint:{"text-color":["case",sel,"#c2410c","#0b5d99"],"text-halo-color":"#ffffff","text-halo-width":2}});
  map.addLayer({id:"lake-label",type:"symbol",source:"water",filter:["==",["get","kind"],"lake"],
    layout:{"text-field":["concat","оз. ",["get","name"]],"text-font":["Noto Sans Italic"],"text-size":13,"text-offset":[0,1.4]},
    paint:{"text-color":"#0b5d99","text-halo-color":"#fff","text-halo-width":2}});
  if(sat){map.addSource("cities",{type:"geojson",data:{type:"FeatureCollection",features:CITIES.map(([n,x,y,r])=>({type:"Feature",properties:{n,r},geometry:{type:"Point",coordinates:[x,y]}}))}});
    map.addLayer({id:"cities",type:"symbol",source:"cities",filter:["any",["<=",["get","r"],1],[">=",["zoom"],7]],layout:{"text-field":["get","n"],"text-font":["Noto Sans Bold"],"text-size":["interpolate",["linear"],["zoom"],5,12,10,16],"text-allow-overlap":false},paint:{"text-color":"#ffffff","text-halo-color":"rgba(0,0,0,.75)","text-halo-width":1.6}});}
  if(is3d)map.setTerrain({source:"dem",exaggeration:4});
  try{map.setSky({"sky-color":"#8cc4e8","horizon-color":"#e6f1f5","fog-color":"#eef4f6","sky-horizon-blend":.6,"horizon-fog-blend":.6,"fog-ground-blend":.4})}catch(e){}
}
let current="sat";
map.on("style.load",addLayers);
map.on("load",addLayers);
const boot=setInterval(()=>{if(map.style&&map.style._loaded){addLayers();clearInterval(boot)}},50);
function setSel(n){
  selected=n; const sel=["==",["get","name"],n||""];
  if(map.getLayer("river")){
    map.setPaintProperty("river","line-color",["case",sel,"#ff7a3d","#1f8fe0"]);
    map.setPaintProperty("river-glow","line-color",["case",sel,"#ffb37a","#7fd0ff"]);
    map.setPaintProperty("lakes","fill-color",["case",sel,"#ff9a5c","#3aa3ec"]);
    map.setPaintProperty("lakes-line","line-color",["case",sel,"#ff7a3d","#ffffff"]);map.setPaintProperty("lakes-line","line-width",["case",sel,3,1.5]);
    map.setPaintProperty("water-label","text-color",["case",sel,"#c2410c","#0b5d99"]);
  }
}
// ---------- UI ----------
const list=document.getElementById("list"), card=document.getElementById("card");
const chips={};
for(const [title,type] of [["Реки","river"],["Озёра","lake"]]){
  const h=document.createElement("h4");h.textContent=title;list.appendChild(h);
  for(const [n,c] of Object.entries(CARDS)){ if(c.type!==type)continue;
    const b=document.createElement("button");b.className="chip "+type;b.setAttribute("aria-pressed","false");b.innerHTML=`<i></i>${n}`;b.onclick=()=>select(n,true);list.appendChild(b);chips[n]=b}
}
function bbox(f){let a=[180,90,-180,-90];const walk=c=>{if(typeof c[0]==="number"){a[0]=Math.min(a[0],c[0]);a[1]=Math.min(a[1],c[1]);a[2]=Math.max(a[2],c[0]);a[3]=Math.max(a[3],c[1])}else c.forEach(walk)};walk(f.geometry.coordinates);return a}
function select(n,fly){
  setSel(n); for(const k in chips)chips[k].setAttribute("aria-pressed",k===n);
  const c=CARDS[n], lake=c.type==="lake";
  card.innerHTML=`<button class="close" aria-label="Закрыть" id="close">×</button><div class="kind">${lake?"Озеро":"Река"}</div><h2>${n}</h2><div class="be">по-белорусски: ${c.be}</div>
  <dl class="stats">${c.stats.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
  <h3>${lake?"Связь с реками":"Откуда и куда"}</h3>
  <div class="route"><span class="dot"></span><span><b>${c.from[0]}</b><small>${c.from[1]}</small></span><span class="ln"></span><span></span><span class="dot end"></span><span><b>${c.to[0]}</b><small>${c.to[1]}</small></span></div>
  <h3>История названия</h3><p>${c.name}</p><h3>Интересные факты</h3><ul>${c.facts.map(f=>`<li>${f}</li>`).join("")}</ul>
  <div class="note">Прототип: цифры округлены, перед публикацией их нужно сверить со справочниками.</div>`;
  card.classList.remove("hide");
  document.getElementById("close").onclick=()=>{card.classList.add("hide");setSel(null);for(const k in chips)chips[k].setAttribute("aria-pressed",false)};
  if(fly){const f=GEO.water.features.find(f=>f.properties.name===n);const b=bbox(f);
    const wide=innerWidth>760;
    map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{padding:wide?{top:80,bottom:60,left:220,right:400}:{top:70,bottom:innerHeight*.6,left:30,right:30},pitch:is3d?55:0,bearing:-15,duration:2200,maxZoom:lake?11:9})}
}
map.on("click","river-hit",e=>select(e.features[0].properties.name,false));
map.on("click","lakes",e=>select(e.features[0].properties.name,false));
for(const l of ["river-hit","lakes"]){map.on("mouseenter",l,()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave",l,()=>map.getCanvas().style.cursor="")}
const hint=document.getElementById("zoomhint");
map.on("zoom",()=>{hint.style.opacity=map.getZoom()>=8.5?0:1});
document.querySelectorAll("[data-base]").forEach(b=>b.onclick=()=>{if(current===b.dataset.base)return;current=b.dataset.base;
  document.querySelectorAll("[data-base]").forEach(x=>x.setAttribute("aria-pressed",x===b));map.setStyle(current==="sat"?STYLE_SAT:STYLE_MAP,{diff:false})});
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{is3d=b.dataset.v==="3d";
  document.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  if(is3d){map.setTerrain({source:"dem",exaggeration:4});map.easeTo({pitch:55,duration:900})}else{map.setTerrain(null);map.easeTo({pitch:0,bearing:0,duration:900})}});
</script>
