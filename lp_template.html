<style>
/* Layout: a low-poly paper diorama of Belarus fills the screen; paper cards float over it */
:root{
  --paper:#fff6e4; --paper2:#f6e7cc; --ink:#22303c; --ink2:#5d6a72; --accent:#e9684a; --river:#3aa6b9; --line:rgba(34,48,60,.14);
  --shadow:rgba(80,50,30,.28);

  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#f8dcc0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.paper{background:var(--paper);border:1px solid rgba(255,255,255,.7);box-shadow:0 14px 30px -16px var(--shadow),0 2px 0 var(--paper2)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 14px);border-radius:14px;padding:10px 16px 11px;z-index:3}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;margin:0;line-height:1.1;text-transform:uppercase;white-space:nowrap}
.brand h1 b{color:var(--accent);font-weight:700}
.brand p{margin:3px 0 0;font-size:12.5px;color:var(--ink2);max-width:30ch}
.list{position:fixed;left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);border-radius:14px;padding:6px;z-index:3;display:flex;flex-direction:column-reverse;gap:4px;width:250px}
.list.collapsed{width:auto}
.list.collapsed #listBody{display:none}
#listBody{display:flex;flex-direction:column;gap:1px;max-height:calc(100vh - 230px);overflow:auto;overscroll-behavior:contain}
.ltog{border:0;background:none;display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;font-family:var(--f-display);font-weight:500;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.ltog:hover{background:var(--line)}
.ltog .ic{width:16px;height:12px;background:linear-gradient(var(--river) 0 2px,transparent 2px 5px,var(--river) 5px 7px,transparent 7px 10px,var(--river) 10px 12px)}
.ltog .chev{margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(-135deg) translate(-2px,-2px);transition:transform .2s}
.list.collapsed .ltog .chev{transform:rotate(45deg) translate(-2px,-2px)}
.grp{border:0;background:none;display:flex;align-items:center;gap:6px;margin:6px 0 1px;padding:4px 8px;border-radius:7px;font-family:var(--f-display);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-align:left}
.grp:hover{background:var(--line)}
.grp small{font-size:10px;letter-spacing:.04em;opacity:.7}
.grp i{margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2);transform:rotate(45deg);transition:transform .2s}
.grp[aria-expanded="true"] i{transform:rotate(-135deg)}
.grp[hidden]{display:none!important}
.brand{display:grid;grid-template-columns:auto auto;column-gap:14px;align-items:center}
.brand h1{grid-column:1;grid-row:1}.brand p{grid-column:1/3}
.lang{grid-column:2;grid-row:1;justify-self:end;display:flex;margin:0;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:3px 9px;font-family:var(--f-display);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.list h4{margin:4px 8px 2px;font-family:var(--f-display);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.chip{border:0;background:none;text-align:left;padding:5px 10px;border-radius:8px;font-weight:800;font-size:13.5px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.chip:hover{background:var(--line)}
.chip i{width:9px;height:9px;transform:rotate(45deg);background:var(--river)}
.chip.lake i{border-radius:50%;transform:none}
.chip.minor{font-weight:700;font-size:12.5px;padding:3px 10px}
#search{font:inherit;font-size:13px;border:1px solid var(--line);background:#fffaf0;border-radius:8px;padding:7px 10px;margin:2px 2px 6px;min-width:0;color:var(--ink)}
.chip[hidden],#list h4[hidden]{display:none!important}
#search:focus{outline:2px solid var(--accent);outline-offset:1px}
.chip[aria-pressed="true"]{color:var(--accent)}.chip[aria-pressed="true"] i{background:var(--accent)}
.credit{position:fixed;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 2px);z-index:2;font-size:10px;color:var(--ink2);opacity:.75}
.credit a{color:inherit}
.tools{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;z-index:3}
.tools button{border-radius:999px;padding:9px 15px;font-family:var(--f-display);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.city{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 6px var(--paper);will-change:transform}
.city{font-size:15px;font-weight:700;letter-spacing:.1em}
.city.small{font-size:11.5px;font-weight:500;color:#33414b}
.city.tiny{font-size:10px;font-weight:500;color:#3e4c55;letter-spacing:.06em}
.bubble{position:fixed;left:0;top:0;z-index:3;border:0;border-radius:12px;padding:7px 13px 8px;background:var(--paper);box-shadow:0 10px 24px -10px var(--shadow),0 2px 0 var(--paper2);display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;will-change:transform}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:var(--paper);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bubble .bk{font-family:var(--f-display);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.bubble .bn{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.bubble .bm{font-size:11.5px;font-weight:800;color:var(--ink2)}
.bubble:hover .bm{color:var(--accent)}
.card{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);width:350px;max-height:calc(100% - 90px);border-radius:14px;padding:22px;overflow:auto;z-index:4;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.card.hide{transform:translateX(30px) rotate(1deg);opacity:0;pointer-events:none}
.close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:var(--line);font-size:18px;line-height:1}
.kind{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--accent)}
.card h2{font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:.03em;text-transform:uppercase;margin:2px 0 0;line-height:1.1}
.be{color:var(--ink2);font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin:14px 0}
.stats div{background:var(--paper2);padding:9px 12px}
.stats dt{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.stats dd{margin:2px 0 0;font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.route{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.route .dot{width:10px;height:10px;transform:rotate(45deg);border:2px solid var(--river);margin-top:6px}
.route .dot.end{background:var(--river)}.route .ln{width:2px;height:14px;background:var(--river);opacity:.4;margin-left:5px}
.route b{display:block;font-weight:800}.route small{color:var(--ink2);font-size:12px}
.card h3{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:16px 0 6px}
.card p{margin:0}.card ul{margin:0;padding-left:18px;display:grid;gap:6px}
.note{margin-top:16px;font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:10px}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);z-index:1}
@media (max-width:760px){
  .brand p{display:none}
  .card{top:auto;left:calc(env(safe-area-inset-left,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);max-height:55%;z-index:5}
  .card.hide{transform:translateY(40px)}
  .list{left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:auto;max-width:calc(100% - 20px);z-index:6}
  .list:not(.collapsed){right:10px}
  #listBody{max-height:52vh}
  .tools{top:calc(env(safe-area-inset-top,0px) + 74px);bottom:auto;right:10px}
  .credit{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 116px);right:12px}
  .tools button{padding:7px 12px;font-size:12px}
  .brand h1{font-size:21px}
}
</style>
